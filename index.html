<body>
    
    <div id="formulario">

        <h2>Punto A</h2>

        <input type="number" id="x1">

        <label>Y1:</label>
        <input type="number" id="y1">

        <h2>Punto B</h2>
        <label>X2:</label>
        <input type="number" id="x2">

        <label>Y2:</label>
        <input type="number" id="y2">

        <button onclick="calcularDistancia()">
            Calcular distancia
        </button>
    </div>

    
    <div id="parte-resultado">
        <div id="tarjeta-blanca">
            <p id="texto-resultado"></p>
        </div>
    </div>

<script src="script.js"></script>
